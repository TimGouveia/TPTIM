<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teleprompter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#101820">
<style>
:root{
  --bg:#E6EBEF; --panel:#fff; --ink:#101820; --muted:#5b6670; --line:#c7d0d8; --accent:#0b6e6e; --accent-ink:#fff;
  --f-sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Editor ---------- */
#editor{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:20px;max-width:1280px;margin:0 auto;
  padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
.status{color:var(--muted);font-size:.85rem}
#text{flex:1;min-height:46vh;width:100%;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  padding:18px;font-size:1.05rem;line-height:1.6;color:var(--ink)}
.side{display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.box h2{font-size:.95rem;margin:0 0 12px}
.row{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.sz{margin-top:14px}
.sz .row{justify-content:space-between;margin-bottom:6px;font-size:.9rem}
.sz .row b{font-variant-numeric:tabular-nums}
.sz .ctl{display:flex;gap:8px;align-items:center}
.sz button{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:1rem}
input[type=range]{flex:1;accent-color:var(--accent);height:40px}
#tags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#tags li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
#tags .name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tags .n{color:var(--muted);font-size:.8rem}
#tags input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff;cursor:pointer}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.empty code{background:#eef2f5;padding:1px 5px;border-radius:4px}
#start{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:1.2rem;font-weight:700;padding:20px;width:100%}
#start:disabled{opacity:.45;cursor:not-allowed}
#start:hover:not(:disabled){filter:brightness(1.1)}
@media (max-width:860px){#editor{grid-template-columns:1fr}#text{min-height:38vh}}

/* ---------- Apresentação ---------- */
#stage{position:fixed;inset:0;background:#000;color:#fff;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
#stage::-webkit-scrollbar{display:none}
#bar{position:fixed;left:0;top:0;bottom:0;width:8px;background:#fff;transition:background-color .35s ease;z-index:2;pointer-events:none}
#script{margin-left:max(6vw,24px);margin-right:6vw;max-width:1000px;padding:42vh 0 100vh}
.blk{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:0 0 1.4em}
#hud{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:6px;
  padding:8px;border-radius:16px;background:rgba(28,32,36,.92);border:1px solid #333;transition:opacity .3s}
#hud.off{opacity:0;pointer-events:none}
#hud button{min-width:48px;height:48px;border:0;border-radius:10px;background:#2a2f34;color:#fff;font-size:1.1rem;padding:0 14px}
#hud button:hover{background:#3a4148}
#hud #play{background:var(--accent);min-width:84px;font-weight:700}
#hud .spd{min-width:64px;text-align:center;color:#cfd6dc;font-variant-numeric:tabular-nums;font-size:.9rem}
#hud .sep{width:1px;height:28px;background:#444;margin:0 4px}
body.show-cursor-off #stage{cursor:none}
</style>
</head>
<body>

<!-- ============ MODO EDITOR ============ -->
<div id="editor">
  <div class="main">
    <header class="top">
      <h1>Teleprompter</h1>
      <span class="status" id="status" aria-live="polite">Salvo neste dispositivo</span>
    </header>
    <label for="text" class="status">Cole ou digite seu texto. Marque as seções com hashtags, como #Introdução.</label>
    <textarea id="text" spellcheck="true" placeholder="#Introdução&#10;Bom dia a todos…&#10;&#10;#Desenvolvimento&#10;O ponto central é…&#10;&#10;#Conclusão&#10;Para encerrar…"></textarea>
  </div>

  <aside class="side">
    <section class="box" aria-labelledby="h-typo">
      <h2 id="h-typo">Fonte</h2>
      <div class="seg" id="fonts" role="group" aria-label="Família da fonte">
        <button data-f="sans" style="font-family:var(--f-sans)">Sans</button>
        <button data-f="serif" style="font-family:var(--f-serif)">Serif</button>
        <button data-f="mono" style="font-family:var(--f-mono)">Mono</button>
      </div>
      <div class="sz">
        <div class="row"><span>Tamanho</span><b id="szv"></b></div>
        <div class="ctl">
          <button id="szm" aria-label="Diminuir fonte">A−</button>
          <input type="range" id="sz" min="24" max="160" step="2" aria-label="Tamanho da fonte">
          <button id="szp" aria-label="Aumentar fonte">A+</button>
        </div>
      </div>
    </section>

    <section class="box" aria-labelledby="h-tags">
      <h2 id="h-tags">Cores das seções</h2>
      <ul id="tags"></ul>
      <p class="empty" id="no-tags">Nenhuma hashtag no texto ainda. Digite algo como <code>#Introdução</code> e a cor aparece aqui.</p>
    </section>

    <button id="start">Iniciar apresentação</button>
  </aside>
</div>

<!-- ============ MODO APRESENTAÇÃO ============ -->
<div id="present" hidden>
  <div id="bar"></div>
  <div id="stage" tabindex="-1"><div id="script"></div></div>
  <div id="hud" role="toolbar" aria-label="Controles do teleprompter">
    <button id="exit" aria-label="Voltar ao editor">Sair</button>
    <span class="sep"></span>
    <button id="slow" aria-label="Mais devagar">−</button>
    <span class="spd" id="spd">5</span>
    <button id="fast" aria-label="Mais rápido">+</button>
    <span class="sep"></span>
    <button id="play">Play</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const KEY = 'teleprompter:v1';
  const FONTS = { sans:'var(--f-sans)', serif:'var(--f-serif)', mono:'var(--f-mono)' };
  const PALETTE = ['#2fb7a6','#f5a524','#ef5d8a','#6c8cff','#9ad84a','#c27bff','#ff7a45','#3cc9f0'];
  const TAG_RE = /#[\p{L}\p{N}_]+/gu;

  /* ---------- Estado + persistência ---------- */
  const defaults = { text:'', font:'sans', size:64, speed:5, colors:{} };
  let S = load();
  function load(){
    try { return { ...defaults, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; }
    catch { return { ...defaults }; }
  }
  let saveTimer;
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); $('status').textContent = 'Salvo neste dispositivo'; }
    catch { $('status').textContent = 'Não foi possível salvar (armazenamento cheio ou bloqueado)'; }
  }
  const saveSoon = () => { $('status').textContent = 'Salvando…'; clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); };

  /* ---------- Hashtags ---------- */
  const tagKey = t => t.toLocaleLowerCase();
  function detectTags(text){
    const map = new Map();
    for (const m of text.matchAll(TAG_RE)) {
      const k = tagKey(m[0]);
      const e = map.get(k) || { label:m[0], count:0 };
      e.count++; map.set(k, e);
    }
    return [...map.entries()].map(([key, v]) => ({ key, ...v }));
  }
  function colorFor(key){
    if (!S.colors[key]) {
      const used = Object.keys(S.colors).length;
      S.colors[key] = PALETTE[used % PALETTE.length];
    }
    return S.colors[key];
  }
  /* Divide o texto em blocos: cada hashtag abre um novo bloco.
     A hashtag funciona como marcador e não aparece na leitura. */
  function parseBlocks(text){
    const blocks = []; let cur = { tag:null, text:'' }; let last = 0;
    for (const m of text.matchAll(TAG_RE)) {
      cur.text += text.slice(last, m.index);
      blocks.push(cur);
      cur = { tag:tagKey(m[0]), text:'' };
      last = m.index + m[0].length;
    }
    cur.text += text.slice(last);
    blocks.push(cur);
    return blocks.map(b => ({ ...b, text:b.text.replace(/^[ \t]*\r?\n?/, '').trim() })).filter(b => b.text);
  }

  /* ---------- Editor ---------- */
  function renderTags(){
    const tags = detectTags($('text').value);
    const ul = $('tags');
    // Atualiza só se a lista mudou, para não perder o foco do color picker
    const sig = tags.map(t => t.key + t.count).join('|');
    if (ul.dataset.sig === sig) return;
    ul.dataset.sig = sig; ul.innerHTML = '';
    for (const t of tags) {
      const li = document.createElement('li');
      const name = document.createElement('span'); name.className = 'name'; name.textContent = t.label;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = t.count + '×';
      const inp = document.createElement('input'); inp.type = 'color'; inp.value = colorFor(t.key);
      inp.setAttribute('aria-label', 'Cor de ' + t.label);
      inp.addEventListener('input', () => { S.colors[t.key] = inp.value; saveSoon(); });
      li.append(name, n, inp); ul.append(li);
    }
    $('no-tags').hidden = tags.length > 0;
    saveSoon();
  }
  function applyFontUI(){
    document.querySelectorAll('#fonts button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === S.font));
    $('text').style.fontFamily = FONTS[S.font];
    $('sz').value = S.size; $('szv').textContent = S.size + ' px';
  }
  const setSize = v => { S.size = Math.max(24, Math.min(160, v)); applyFontUI(); saveSoon(); };

  $('text').addEventListener('input', () => { S.text = $('text').value; renderTags(); saveSoon(); });
  $('fonts').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.font = b.dataset.f; applyFontUI(); saveSoon(); } });
  $('sz').addEventListener('input', e => setSize(+e.target.value));
  $('szm').addEventListener('click', () => setSize(S.size - 4));
  $('szp').addEventListener('click', () => setSize(S.size + 4));

  /* ---------- Apresentação ---------- */
  const stage = $('stage'), script = $('script'), bar = $('bar'), hud = $('hud');
  let playing = false, pos = 0, last = 0, raf = 0, hideT, wake = null, blocksEls = [], active = -1, presenting = false;
  const pxPerSec = () => S.speed * S.size * 0.12;

  function buildScript(){
    script.innerHTML = ''; blocksEls = [];
    script.style.fontFamily = FONTS[S.font];
    script.style.fontSize = S.size + 'px';
    for (const b of parseBlocks(S.text)) {
      const p = document.createElement('p'); p.className = 'blk'; p.textContent = b.text;
      p.dataset.color = b.tag ? colorFor(b.tag) : '#ffffff';
      script.append(p); blocksEls.push(p);
    }
  }
  /* Bloco "em foco" = último bloco cujo topo já passou da linha de leitura (40% da tela) */
  function updateBar(){
    const line = stage.clientHeight * 0.4; let idx = 0;
    for (let i = 0; i < blocksEls.length; i++) {
      if (blocksEls[i].getBoundingClientRect().top <= line) idx = i; else break;
    }
    if (idx !== active && blocksEls[idx]) { active = idx; bar.style.backgroundColor = blocksEls[idx].dataset.color; }
  }
  function frame(t){
    if (!presenting) return;
    if (playing) {
      const dt = Math.min(.1, (t - last) / 1000);
      // se o usuário rolou manualmente, sincroniza antes de continuar
      if (Math.abs(stage.scrollTop - pos) > 2) pos = stage.scrollTop;
      pos += pxPerSec() * dt;
      const max = stage.scrollHeight - stage.clientHeight;
      if (pos >= max) { pos = max; setPlaying(false); }
      stage.scrollTop = pos;
    }
    last = t; updateBar(); raf = requestAnimationFrame(frame);
  }
  function setPlaying(v){
    playing = v; $('play').textContent = v ? 'Pause' : 'Play';
    if (v) pos = stage.scrollTop;
    showHud();
  }
  function showHud(){
    hud.classList.remove('off'); document.body.classList.remove('show-cursor-off');
    clearTimeout(hideT);
    hideT = setTimeout(() => { if (presenting) { hud.classList.add('off'); document.body.classList.add('show-cursor-off'); } }, 3000);
  }
  function setSpeed(d){ S.speed = Math.max(1, Math.min(20, S.speed + d)); $('spd').textContent = S.speed; save(); showHud(); }

  async function lockScreen(){ try { wake = await navigator.wakeLock?.request('screen'); } catch {} }
  function unlockScreen(){ try { wake?.release(); } catch {} wake = null; }

  async function enter(){
    S.text = $('text').value; save();
    if (!parseBlocks(S.text).length) return;
    buildScript(); presenting = true; active = -1;
    $('editor').hidden = true; $('present').hidden = false;
    stage.scrollTop = 0; pos = 0; $('spd').textContent = S.speed;
    try { await document.documentElement.requestFullscreen?.(); } catch {}
    lockScreen(); stage.focus(); setPlaying(false);
    last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }
  function leave(){
    if (!presenting) return;
    presenting = false; playing = false; cancelAnimationFrame(raf); clearTimeout(hideT); unlockScreen();
    document.body.classList.remove('show-cursor-off');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    $('present').hidden = true; $('editor').hidden = false;
  }

  $('start').addEventListener('click', enter);
  $('exit').addEventListener('click', leave);
  $('play').addEventListener('click', () => setPlaying(!playing));
  $('slow').addEventListener('click', () => setSpeed(-1));
  $('fast').addEventListener('click', () => setSpeed(1));
  // Toque/clique na tela: alterna play/pause (cliques no HUD não contam)
  stage.addEventListener('click', () => setPlaying(!playing));
  ['pointermove','touchstart','wheel'].forEach(ev => $('present').addEventListener(ev, () => presenting && showHud(), { passive:true }));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) leave(); });
  document.addEventListener('visibilitychange', () => { if (presenting && document.visibilityState === 'visible') lockScreen(); });
  document.addEventListener('keydown', e => {
    if (!presenting) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') { e.preventDefault(); setSpeed(1); }
    else if (e.key === 'ArrowDown' || e.key === '-') { e.preventDefault(); setSpeed(-1); }
    else if (e.key === 'Escape') leave();
  });

  /* ---------- Init + PWA ---------- */
  $('text').value = S.text; applyFontUI(); renderTags();
  $('status').textContent = 'Salvo neste dispositivo';
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
